<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>PDF Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: transparent;
    font-family: system-ui, Arial, sans-serif;
  }
  #viewer {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 24px 16px 90px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  #viewer canvas {
    max-width: 100%;
    height: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    border-radius: 8px;
    background: white;
  }
  #toolbar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30,41,59,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: white;
    border-radius: 50px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
    box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    font-size: 0.9rem;
    font-weight: 600;
  }
  #toolbar button {
    background: none;
    border: none;
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 50%;
    transition: background 0.2s;
    line-height: 1;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.15); }
  #toolbar .sep {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.25);
  }
  #toolbar a {
    color: white;
    text-decoration: none;
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 50px;
    transition: background 0.2s;
  }
  #toolbar a:hover { background: rgba(255,255,255,0.15); }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(248,250,252,0.85);
    backdrop-filter: blur(4px);
    color: #475569;
    font-weight: 600;
    flex-direction: column;
    gap: 14px;
  }
  #loading .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #e2e8f0;
    border-top-color: #0ea5e9;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading.hidden { display: none; }
</style>
</head>
<body>

<div id="viewer"></div>

<div id="toolbar">
  <button id="prev" title="Pagina precedente">◀</button>
  <span id="pageInfo">1 / 1</span>
  <button id="next" title="Pagina successiva">▶</button>
  <span class="sep"></span>
  <button id="zoomOut" title="Riduci">−</button>
  <span id="zoomInfo">100%</span>
  <button id="zoomIn" title="Aumenta">+</button>
  <span class="sep"></span>
  <a id="openTab" href="#" target="_blank" rel="noopener" title="Apri in nuova scheda">↗</a>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div>Caricamento PDF…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const file = params.get('file') || 'scola.pdf';

  document.getElementById('openTab').href = file;

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const viewer   = document.getElementById('viewer');
  const pageInfo = document.getElementById('pageInfo');
  const zoomInfo = document.getElementById('zoomInfo');
  const loading  = document.getElementById('loading');

  let pdfDoc = null;
  let baseScale = 1.3;
  let scale = baseScale;

  async function renderAll() {
    viewer.innerHTML = '';
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      viewer.appendChild(canvas);
      await page.render({ canvasContext: ctx, viewport }).promise;
    }
    zoomInfo.textContent = Math.round(scale / baseScale * 100) + '%';
  }

  document.getElementById('zoomIn').onclick  = () => { scale += 0.2; renderAll(); };
  document.getElementById('zoomOut').onclick = () => {
    scale = Math.max(0.5, scale - 0.2); renderAll();
  };
  document.getElementById('prev').onclick = () =>
    viewer.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
  document.getElementById('next').onclick = () =>
    viewer.scrollBy({ top: window.innerHeight, behavior: 'smooth' });

  viewer.addEventListener('scroll', () => {
    const canvases = viewer.querySelectorAll('canvas');
    let current = 1;
    canvases.forEach((c, idx) => {
      const rect = c.getBoundingClientRect();
      if (rect.top < window.innerHeight / 2) current = idx + 1;
    });
    pageInfo.textContent = current + ' / ' + pdfDoc.numPages;
  });

  pdfjsLib.getDocument(file).promise
    .then(doc => {
      pdfDoc = doc;
      loading.classList.add('hidden');
      renderAll();
    })
    .catch(err => {
      loading.innerHTML =
        '<div style="text-align:center;max-width:80%">' +
        'Impossibile caricare il PDF.<br>' +
        '<small style="color:#64748b">' + err.message + '</small><br><br>' +
        '<a href="' + file + '" target="_blank" ' +
        'style="color:#b31b1b;font-weight:700">Apri in nuova scheda</a>' +
        '</div>';
    });
</script>
</body>
</html>
