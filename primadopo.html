<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confronto Prima/Dopo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .ba-container {
      position: relative;
      width: 100%;
      max-width: 1200px;   /* era 800px → +50% */
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .ba-before,
    .ba-after {
      display: block;
      width: 100%;
      height: auto;
    }

    .ba-after {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: inset(0 0 0 50%);
    }

    /* Linea verticale */
    .ba-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #fff;
      z-index: 2;
      pointer-events: none;
      transform: translateX(-50%);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* Cerchio in basso */
    .ba-handle::after {
      content: '';
      position: absolute;
      bottom: 20px;
      left: 50%;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #333;
      transform: translateX(-50%);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .ba-range {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: ew-resize;
      z-index: 3;
    }

    /* Mobile: torna a piena larghezza senza padding */
    @media (max-width: 700px) {
      body { padding: 0.4rem; }
      .ba-container { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="ba-container">
    <img src="prima.jpg" alt="Prima" class="ba-before">
    <img src="dopo.jpg" alt="Dopo" class="ba-after">
    <div class="ba-handle"></div>
    <input type="range" min="0" max="100" value="50" class="ba-range" aria-label="Confronta prima e dopo">
  </div>

  <script>
    const container = document.querySelector('.ba-container');
    const range = container.querySelector('.ba-range');
    const after = container.querySelector('.ba-after');
    const handle = container.querySelector('.ba-handle');

    function update() {
      const val = range.value;
      after.style.clipPath = `inset(0 0 0 ${val}%)`;
      handle.style.left = `${val}%`;
    }

    range.addEventListener('input', update);
    update();
  </script>

</body>
</html>
